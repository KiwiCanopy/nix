name: Update flake.lock

# Monthly: moves the nixpkgs pin forward, runs every check against it,
# and opens a PR only when they pass. KiwiDesk's own version comes
# from pkgs/kiwidesk/source.json, not from nixpkgs, so this only
# refreshes the build tools.
on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-lock
  cancel-in-progress: false

env:
  BRANCH: update-flake-lock

jobs:
  update:
    name: Update the lock
    runs-on: macos-15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Update and push the branch
        id: lock
        run: |
          set -euo pipefail
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "flake.lock is already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions\[bot\]
          git config \
            user.email 41898282+github-actions\[bot\]@users.noreply.github.com
          git checkout -B "$BRANCH"
          git add flake.lock
          git commit -m "build: update flake.lock"
          git push --force origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  check:
    name: Check the update
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/check.yml
    with:
      ref: update-flake-lock

  pull-request:
    name: Open the pull request
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Open or refresh the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OPEN="$(gh pr list --repo "$REPO" --head "$BRANCH" \
            --state open --json number --jq 'length')"
          if [ "$OPEN" -gt 0 ]; then
            echo "The PR for $BRANCH is already open; its branch moved"
            exit 0
          fi
          gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            --title "build: update flake.lock" \
            --body "Monthly nixpkgs update. The build, the signature and
          Gatekeeper checks and the Home Manager module evaluation all
          passed on this branch in the run that opened this PR:
          $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID

          A PR opened by the workflow token starts no CI of its own, so
          that run is the check."
