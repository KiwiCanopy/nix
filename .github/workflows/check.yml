name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # update-lock.yml runs these checks on its branch before it opens a
  # PR, since a PR opened with the workflow token triggers no CI.
  workflow_call:
    inputs:
      ref:
        description: Branch to check out and check
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Build and check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - uses: cachix/install-nix-action@v31

      - name: Flake check
        run: nix flake check --print-build-logs

      - name: Build every package
        run: nix build .#kiwidesk --print-build-logs

      # The Accessibility grant follows the Developer ID signature,
      # so a bundle the package changed by a single byte is a bug.
      - name: Signature is intact
        run: |
          set -euo pipefail
          app="$(readlink -f result)/Applications/KiwiDesk.app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
          /usr/sbin/spctl --assess --type execute --verbose=2 "$app"
          test -x result/bin/kiwidesk

      - name: Home Manager module evaluates
        run: scripts/check-module.sh
